version: '3.8'

services:
  mailcandid:
    build:
      context: .
      dockerfile: Dockerfile
    image: automatisation-mail:latest
    container_name: mailcandid-backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      # ── Variables d'environnement (à définir dans .env) ──────────────────
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - ZIMBRA_URL=${ZIMBRA_URL}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - PORT=3001
      # ── Base de données SQLite ───────────────────────────────────────────
      - DATABASE_URL=${DATABASE_URL:-file:./dev.db}
    volumes:
      # Monte le PDF depuis la machine locale (ne pas l'inclure dans l'image)
      - ./CV_LETTRE_DE_RECOMMANDATION.pdf:/app/CV_LETTRE_DE_RECOMMANDATION.pdf:ro
      # Volume persistant pour la base de données SQLite
      - sqlite_data:/app/prisma/
      # Volume persistant pour les documents uploadés par les utilisateurs
      - uploads_data:/app/uploads/
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Logging configuré (format json pour Docker)
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  sqlite_data:
    name: mailcandid_sqlite_data
  uploads_data:
    name: mailcandid_uploads_data
